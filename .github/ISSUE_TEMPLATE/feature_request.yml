name: Feature request
description: Suggest an improvement to the research workflow.
title: '[Feature] '
body:
  - type: textarea
    id: need
    attributes:
      label: Research or workflow need
      description: What are you trying to do, and where does the current workflow fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the intended behavior, alternatives, and how you would judge success.
    validations:
      required: true

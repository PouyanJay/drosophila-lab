name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run install:ci
      - run: npm run check
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  numerical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest research.lab.test_lab research.lab.test_discovery
      - run: python -m unittest discover -s research -p test_runner.py
      - run: python -m ruff format --check scripts research/export_ancestry.py

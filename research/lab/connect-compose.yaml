# Local personal-testing connection. No host ports and no Docker socket mount.
services:
  trainer:
    build:
      context: .
      dockerfile: research/lab/Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    command: ["python", "-m", "research.lab.connected"]
    environment:
      LAB_THREADS: 2
      LAB_MAX_SECONDS: 21600
    volumes:
      - connected-runs:/data
    mem_limit: 8g
    stop_grace_period: 120s
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://trainer:8000"]
    depends_on:
      - trainer
volumes:
  connected-runs:

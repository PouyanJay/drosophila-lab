name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.17'
      - run: npm run install:ci
      - run: npm run check
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  numerical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.17'
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest research.lab.test_lab research.lab.test_discovery
      - run: uv run --frozen python -m unittest discover -s research -p test_runner.py
      - run: uv run --frozen ruff check scripts research/export_ancestry.py
      - run: uv run --frozen ruff format --check scripts research/export_ancestry.py
      - run: uv run --frozen python scripts/check-agents.py
